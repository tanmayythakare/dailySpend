<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="isCollapsed" [class.open]="isMobileOpen">

    <div class="sidebar-header">
      <div class="logo-icon">₹</div>
      <div class="logo-text" *ngIf="!isCollapsed">DailySpend</div>
    </div>

    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="closeMobileSidebar()">
        <span class="nav-icon">🏠</span>
        <span class="nav-label" *ngIf="!isCollapsed">Dashboard</span>
      </a>

      <a routerLink="/transactions" routerLinkActive="active" class="nav-item" (click)="closeMobileSidebar()">
        <span class="nav-icon">🧾</span>
        <span class="nav-label" *ngIf="!isCollapsed">Transactions</span>
      </a>

      <a routerLink="/people" routerLinkActive="active" class="nav-item" (click)="closeMobileSidebar()">
        <span class="nav-icon">👥</span>
        <span class="nav-label" *ngIf="!isCollapsed">People</span>
      </a>

      <a routerLink="/reports" routerLinkActive="active" class="nav-item" (click)="closeMobileSidebar()">
        <span class="nav-icon">📊</span>
        <span class="nav-label" *ngIf="!isCollapsed">Reports</span>
      </a>
    </nav>

    <!-- Pushes logout to bottom -->
    <div class="sidebar-spacer"></div>

    <div class="nav nav-bottom">
      <a class="nav-item nav-logout" (click)="logout()">
        <span class="nav-icon">🚪</span>
        <span class="nav-label" *ngIf="!isCollapsed">Logout</span>
      </a>
    </div>

  </aside>

  <!-- Mobile Overlay -->
  <div class="sidebar-overlay" [class.active]="isMobileOpen" (click)="closeMobileSidebar()"></div>

  <!-- Main Area -->
  <div class="main">

    <header class="topbar">
      <button class="menu-toggle" (click)="toggleSidebar()">☰</button>
      <div class="topbar-title">{{ pageTitle }}</div>
      <div class="topbar-right">
        <span class="currency">₹ INR</span>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
