<div class="reports-container">

  <!-- Header -->
  <div class="reports-header">
    <h1 class="page-title">Reports</h1>
  </div>

  <!-- Summary Cards -->
  <div class="summary-row">

    <!-- Income -->
    <div class="stat-card">
      <div class="stat-body">
        <span class="stat-label">Total Income</span>
        <span class="stat-value">
          {{ formatCurrency(summary.totalIncome) }}
        </span>
      </div>
    </div>

    <!-- Expenses -->
    <div class="stat-card">
      <div class="stat-body">
        <span class="stat-label">Total Expenses</span>
        <span class="stat-value">
          {{ formatCurrency(summary.totalExpenses) }}
        </span>
      </div>
    </div>

    <!-- Net Flow -->
    <div class="stat-card">
      <div class="stat-body">
        <span class="stat-label">Net Flow</span>
        <span class="stat-value"
              [class.positive]="summary.netFlow >= 0"
              [class.negative]="summary.netFlow < 0">
          {{ formatCurrency(summary.netFlow) }}
        </span>
      </div>
    </div>

  </div>

  <!-- Charts -->
  <div class="charts-row">

    <!-- 📈 Spending Trend -->
    <div class="chart-card chart-card--wide">
      <div class="chart-card-header">
        <span class="chart-title">Spending Trend</span>
      </div>

      <apx-chart
        [series]="trendSeries"
        [chart]="trendChart"
        [xaxis]="trendXAxis"
        [stroke]="trendStroke"
        [dataLabels]="trendDataLabels"
        [legend]="trendLegend"
        [tooltip]="trendTooltip">
      </apx-chart>
    </div>

    <!-- 🍩 Expense Breakdown -->
    <div class="chart-card chart-card--donut">
      <div class="chart-card-header">
        <span class="chart-title">Expense Breakdown</span>
      </div>

      <apx-chart
        [series]="donutSeries"
        [chart]="donutChart"
        [labels]="donutLabels"
        [plotOptions]="donutPlotOptions"
        [responsive]="donutResponsive">
      </apx-chart>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" *ngIf="loading">
    <div class="spinner"></div>
  </div>

</div>
