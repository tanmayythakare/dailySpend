<div class="page-container">

  <!-- Header — back link left, title centre -->
  <div class="transaction-form__header">
    <a class="transaction-form__back-btn" routerLink="/transactions">
      ← Back to Transactions
    </a>
    <span class="transaction-form__title">
      {{ isEditMode ? 'Edit Transaction' : 'New Transaction' }}
    </span>
    <span></span><!-- spacer keeps title centred -->
  </div>

  <!-- Form Card -->
  <div class="transaction-form__card">

    <!-- Messages -->
    <div class="alert alert--error"   *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="alert alert--success" *ngIf="successMessage">{{ successMessage }}</div>

    <!-- Type Selector — pill toggle -->
    <div class="transaction-form__type-selector">

      <button type="button"
        class="transaction-form__type-option"
        [class.active]="transactionData.type === 'EXPENSE'"
        [class.active-expense]="transactionData.type === 'EXPENSE'"
        (click)="selectType('EXPENSE')">
        <span class="type-icon">💸</span>
        Expense
      </button>

      <button type="button"
        class="transaction-form__type-option"
        [class.active]="transactionData.type === 'MONEY_GIVEN'"
        (click)="selectType('MONEY_GIVEN')">
        <span class="type-icon">➡️</span>
        Money Given
      </button>

      <button type="button"
        class="transaction-form__type-option"
        [class.active]="transactionData.type === 'MONEY_TAKEN'"
        [class.active-money-taken]="transactionData.type === 'MONEY_TAKEN'"
        (click)="selectType('MONEY_TAKEN')">
        <span class="type-icon">⬅️</span>
        Money Taken
      </button>

    </div>

    <!-- Fields -->
    <form class="transaction-form__fields" (ngSubmit)="onSubmit()">

      <!-- Account + Amount -->
      <div class="transaction-form__row">

        <div class="form-field">
          <label for="account">Account <span style="color:var(--negative)">*</span></label>
          <select id="account" name="account"
            [(ngModel)]="transactionData.accountId" required>
            <option [ngValue]="null" disabled>Select an account</option>
            <option *ngFor="let account of accounts" [ngValue]="account.id">
              {{ account.name }} ({{ formatCurrency(account.balance) }})
            </option>
          </select>
        </div>

        <div class="form-field transaction-form__amount-field">
          <label for="amount">Amount <span style="color:var(--negative)">*</span></label>
          <input type="number" id="amount" name="amount"
            [(ngModel)]="transactionData.amount"
            placeholder="0.00" step="0.01" min="0.01" required />
        </div>

      </div>

      <!-- Category (EXPENSE only) -->
      <div class="form-field" *ngIf="transactionData.type === 'EXPENSE'">
        <label for="category">Category</label>
        <select id="category" name="category" [(ngModel)]="transactionData.categoryId">
          <option [ngValue]="null">Select a category (optional)</option>
          <option *ngFor="let category of categories" [ngValue]="category.id">
            {{ category.name }}
          </option>
        </select>
      </div>

      <!-- Person (MONEY_GIVEN / MONEY_TAKEN) -->
      <div class="form-field" *ngIf="transactionData.type !== 'EXPENSE'">
        <label for="person">Person <span style="color:var(--negative)">*</span></label>
        <select id="person" name="person"
          [(ngModel)]="transactionData.personId" required>
          <option [ngValue]="null" disabled>Select a person</option>
          <option *ngFor="let person of people" [ngValue]="person.id">
            {{ person.name }}
          </option>
        </select>
      </div>

      <!-- Date -->
      <div class="form-field">
        <label for="date">Transaction Date <span style="color:var(--negative)">*</span></label>
        <input type="date" id="date" name="date"
          [(ngModel)]="transactionData.transactionDate" required />
      </div>

      <!-- Description -->
      <div class="form-field">
        <label for="description">Description</label>
        <textarea id="description" name="description"
          [(ngModel)]="transactionData.description"
          placeholder="Add notes about this transaction..."
          rows="3"></textarea>
      </div>

      <!-- Actions -->
      <div class="transaction-form__actions">
        <button type="button" class="btn btn--outline cancel-btn" routerLink="/transactions">
          Cancel
        </button>
        <button type="submit" class="btn btn--primary submit-btn"
          [disabled]="loading || !isFormValid()">
          {{ loading ? 'Saving...' : (isEditMode ? 'Update Transaction' : 'Create Transaction') }}
        </button>
      </div>

    </form>
  </div>
</div>
