<h1>Dashboard</h1>

<h3>Create Account</h3>

<input
  type="text"
  placeholder="Account Name"
  [(ngModel)]="newAccountName"
  name="name"
/>

<input
  type="number"
  placeholder="Initial Balance"
  [(ngModel)]="newAccountBalance"
  name="balance"
/>

<select
  [(ngModel)]="newAccountType"
  name="type"
>
  <option value="" disabled>Select account type</option>

  <option *ngFor="let type of accountTypes" [value]="type">
    {{ type }}
  </option>
</select>

<button (click)="createAccount()">Create</button>

<hr />

<div *ngIf="loading">Loading accounts...</div>

<div *ngIf="!loading && accounts.length === 0">
  No accounts found.
</div>

<div *ngIf="!loading && accounts.length > 0">
  <h3>Your Accounts</h3>
  <div *ngFor="let account of accounts">
    <strong>{{ account.name }}</strong>
    - Balance: {{ account.balance ?? 0 }}
    - Type: {{ account.type }}
  </div>
</div>

<h3 *ngIf="!loading">
  Total Net Worth: {{ totalBalance }}
</h3>
