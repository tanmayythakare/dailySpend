<h1>Dashboard</h1>

<div class="messages">
  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>

<h2>Create Account</h2>

<div class="form-container">
  <input
    type="text"
    placeholder="Account Name"
    [(ngModel)]="newAccountName"
  />

  <input
    type="number"
    placeholder="Initial Balance"
    [(ngModel)]="newAccountBalance"
  />

  <select [(ngModel)]="newAccountType">
    <option value="" disabled>Select account type</option>
    <option *ngFor="let type of accountTypes" [value]="type">
      {{ type }}
    </option>
  </select>

  <button (click)="createAccount()" [disabled]="creating">
    {{ creating ? 'Creating...' : 'Create Account' }}
  </button>
</div>

<hr />

<div *ngIf="loading">Loading accounts...</div>

<div class="accounts-grid" *ngIf="!loading && accounts.length > 0">
  <div class="account-card" *ngFor="let account of accounts">
    <h3>{{ account.name }}</h3>
    <p><strong>Type:</strong> {{ account.type }}</p>
    <p><strong>Balance:</strong> {{ formatCurrency(account.balance) }}</p>

    <button class="delete-btn" (click)="deleteAccount(account.id!)">
      Delete
    </button>
  </div>
</div>

<div *ngIf="!loading && accounts.length === 0">
  No accounts found.
</div>

<hr />

<h2>Total Net Worth: {{ formatCurrency(totalBalance) }}</h2>
