<h2>Account Details</h2>
<div *ngIf="loading">Loading...</div>
<div *ngIf="error">{{ error }}</div>
<div *ngIf="account">
  <p><strong>Name:</strong> {{ account.name }}</p>
  <p><strong>Type:</strong> {{ account.type }}</p>
  <p><strong>Balance:</strong> {{ formatCurrency(account.balance) }}</p>
</div>
